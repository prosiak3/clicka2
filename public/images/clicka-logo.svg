<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fish body -->
  <ellipse cx="512" cy="512" rx="300" ry="350" fill="#2563eb"/>

  <!-- Fish head/face area -->
  <ellipse cx="512" cy="400" rx="100" ry="120" fill="white"/>

  <!-- Eyes -->
  <circle cx="490" cy="380" r="15" fill="#2563eb"/>
  <circle cx="534" cy="380" r="15" fill="#2563eb"/>

  <!-- Smile -->
  <path d="M 470 430 Q 512 450 554 430" stroke="#2563eb" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Fishing hook line -->
  <line x1="512" y1="100" x2="512" y2="300" stroke="white" stroke-width="8" stroke-linecap="round"/>

  <!-- Fishing hook -->
  <path d="M 480 140 L 512 100 L 544 140" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 512 100 Q 512 120 520 130" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Tail fin -->
  <ellipse cx="512" cy="850" rx="180" ry="50" fill="white" opacity="0.9"/>
  <ellipse cx="512" cy="840" rx="160" ry="45" fill="#2563eb" opacity="0.3"/>

  <!-- Side fins -->
  <ellipse cx="280" cy="480" rx="60" ry="100" fill="white" opacity="0.8" transform="rotate(-30 280 480)"/>
  <ellipse cx="744" cy="480" rx="60" ry="100" fill="white" opacity="0.8" transform="rotate(30 744 480)"/>

  <!-- Water ripple effect -->
  <circle cx="512" cy="900" r="140" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>
  <circle cx="512" cy="900" r="170" fill="none" stroke="white" stroke-width="3" opacity="0.2"/>
</svg>
