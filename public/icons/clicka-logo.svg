<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Fish illustration -->
  <g transform="translate(50, 40)">
    <!-- Fish body -->
    <path d="M10 50 Q20 30, 40 25 Q60 22, 80 30 Q90 35, 95 50 Q90 65, 80 70 Q60 78, 40 75 Q20 70, 10 50 Z"
          fill="white" stroke="white" stroke-width="2"/>

    <!-- Fish tail -->
    <path d="M5 50 L-10 35 L-5 50 L-10 65 Z"
          fill="white" stroke="white" stroke-width="2"/>

    <!-- Fish fins -->
    <path d="M40 65 Q35 75, 30 78"
          stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M60 30 Q65 20, 70 18"
          stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Fish eye -->
    <circle cx="75" cy="45" r="4" fill="#2a3441"/>

    <!-- Fishing rod -->
    <g transform="translate(85, 15)">
      <line x1="0" y1="0" x2="25" y2="-10"
            stroke="white" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="-10" x2="30" y2="20"
            stroke="white" stroke-width="1" stroke-linecap="round"/>
      <circle cx="30" cy="20" r="2" fill="white"/>
    </g>

    <!-- Bubbles -->
    <circle cx="20" cy="30" r="2" fill="white" opacity="0.6"/>
    <circle cx="30" cy="25" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="15" cy="40" r="1.5" fill="white" opacity="0.6"/>
  </g>

  <!-- "Clicka" text -->
  <text x="180" y="90"
        font-family="Arial, sans-serif"
        font-size="52"
        font-weight="bold"
        fill="white"
        letter-spacing="-1">Clicka</text>

  <!-- Small star accents -->
  <circle cx="360" cy="50" r="2" fill="white" opacity="0.8"/>
  <circle cx="370" cy="70" r="1.5" fill="white" opacity="0.6"/>
</svg>
